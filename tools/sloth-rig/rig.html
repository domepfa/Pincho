<!doctype html><html><body style="margin:0;background:#0b0f14">
<svg id="s" viewBox="-40 -60 1104 1100" width="880" height="876" style="display:block">
 <g id="all">
  <g id="tail" ><image href="tail.png" x="474" y="670" width="86" height="162"/></g>
  <g id="leg_l"><circle cx="428" cy="614" r="48" fill="#4a3a2b" stroke="#16120e" stroke-width="6"/><g id="calf_l"><circle cx="408" cy="786" r="46" fill="#4a3a2b" stroke="#16120e" stroke-width="6"/><image href="calf_l.png" x="336" y="776" width="143" height="215"/></g><image href="thigh_l.png" x="329" y="590" width="163" height="209"/></g>
  <g id="leg_r"><circle cx="597" cy="614" r="48" fill="#4a3a2b" stroke="#16120e" stroke-width="6"/><g id="calf_r"><circle cx="616" cy="786" r="46" fill="#4a3a2b" stroke="#16120e" stroke-width="6"/><image href="calf_r.png" x="545" y="776" width="143" height="215"/></g><image href="thigh_r.png" x="532" y="590" width="163" height="209"/></g>
  <g id="upper">
   <g id="arm_l"><circle cx="251" cy="397" r="44" fill="#4a3a2b" stroke="#16120e" stroke-width="6"/><image href="forearm_l.png" x="16" y="333" width="241" height="127"/></g>
   <g id="arm_r"><circle cx="773" cy="397" r="44" fill="#4a3a2b" stroke="#16120e" stroke-width="6"/><image href="forearm_r.png" x="768" y="333" width="240" height="127"/></g>
   <image href="torso.png" x="244" y="61" width="536" height="605"/>
  </g>
 </g>
</svg>
<script>
const P = {"el": [251, 397], "er": [773, 397], "hl": [428, 614], "hr": [597, 614], "kl": [408, 786], "kr": [616, 786], "tail": [516, 686]};
const rot = (id, a, p) => document.getElementById(id).setAttribute('transform', `rotate(${a} ${p[0]} ${p[1]})`);
const S = (t) => Math.sin(t * Math.PI * 2);
const ease = (t) => 0.5 - 0.5 * Math.cos(t * Math.PI * 2); // 0..1..0
const POSES = {
  flex: (t) => { const e = Math.min(1, ease(t) * 1.4); return { fl: 100 * e, fr: -100 * e, dy: -6 * e, tail: 6 * S(t) }; },
  wave: (t) => ({ fl: -55, fr: -95 + 22 * S(t * 2), dy: 3 * S(t * 2), tail: 8 * S(t) }),
  cheer: (t) => { const e = ease(t); return { fl: 115 * e - 30 * (1 - e), fr: -115 * e + 30 * (1 - e), tl: 10 * e, tr: -10 * e, dy: -45 * e, tail: 12 * e }; },
  squat: (t) => { const e = ease(t); const a = 32 * e; const drop = 380 * (1 - Math.cos(a * Math.PI / 180)); return { fl: -20 * e, fr: 20 * e, tl: a, tr: -a, cl: -2 * a, cr: 2 * a, dy: drop, tail: -6 * e }; },
};
function setPose(name, t) {
  const p = Object.assign({ fl: 0, fr: 0, tl: 0, tr: 0, cl: 0, cr: 0, dy: 0, tail: 0 }, POSES[name](t));
  rot('arm_l', p.fl, P.el); rot('arm_r', p.fr, P.er);
  rot('leg_l', p.tl, P.hl); rot('leg_r', p.tr, P.hr);
  rot('calf_l', p.cl, P.kl); rot('calf_r', p.cr, P.kr);
  rot('tail', p.tail, P.tail);
  // Beim Squat bleiben die Füsse am Boden: nur Oberkörper/Hüfte sinken, Beine knicken
  document.getElementById('all').setAttribute('transform', name === 'squat' ? '' : `translate(0 ${p.dy})`);
  if (name === 'squat') {
    document.getElementById('upper').setAttribute('transform', `translate(0 ${p.dy})`);
    document.getElementById('tail').setAttribute('transform', `translate(0 ${p.dy}) rotate(${p.tail} ${P.tail[0]} ${P.tail[1]})`);
    ['leg_l', 'leg_r'].forEach((id, i) => document.getElementById(id).setAttribute('transform', `translate(0 ${p.dy}) rotate(${i ? p.tr : p.tl} ${(i ? P.hr : P.hl)[0]} ${(i ? P.hr : P.hl)[1]})`));
  } else document.getElementById('upper').removeAttribute('transform');
}
</script></body></html>
